<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>boarddd demo</title>
<style>
  :root { color-scheme: light dark; --bg: #c9ccd6; --fg: #1b1f24; --chip: #ffffffcc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d2128; --fg: #e6e8ec; --chip: #2a2f38cc; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #bar { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  #bar button, #bar label { background: var(--chip); color: inherit; border: 0; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  #status { position: fixed; left: 12px; bottom: 10px; opacity: .75; }
</style>
<div id="stage"></div>
<div id="bar">
  <button data-view="top" title="Top view">⬒</button>
  <button data-view="bottom" title="Bottom view">⬓</button>
  <button data-view="iso" title="Iso view">◩</button>
  <label title="Components (from the GLB)"><input type="checkbox" id="parts" checked> ▣</label>
  <label title="Copper diff against the same board without the mounting holes"><input type="checkbox" id="diff"> Δ</label>
</div>
<div id="status">KiCad demo data: royalblue54L_feather (KiCad's demos/). Loading…</div>
<script src="./importmap.js"></script>
<script type="module" src="./demo.js"></script>
</html>
