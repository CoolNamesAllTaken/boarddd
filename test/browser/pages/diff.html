<!doctype html>
<meta charset="utf-8">
<title>boarddd copper diff</title>
<style>html,body{margin:0;background:#222}canvas{display:block;max-width:100%}</style>
<script src="/test/browser/pages/importmap.js"></script>
<script type="module">
  // Paint test/fixtures/slots-board (head) and its copper diff against slots-board-base (no H1);
  // window.diff = {sample(face, x, y) -> [r, g, b], ...} in board mm.
  import { readFabFiles, paintFaces, paintCopperDiff, faceBounds } from '/src/board/index.js';
  try {
    const load = async (dir) => {
      const m = await (await fetch(dir + 'manifest.json')).json();
      return Promise.all(m.files.map(async (name) => ({ name, text: await (await fetch(dir + name)).text() })));
    };
    const api = null, renderer = null;   // boarddd/gerber and its shared default renderer
    const head = readFabFiles(api, await load('/test/fixtures/slots-board/'));
    const base = readFabFiles(api, await load('/test/fixtures/slots-board-base/'));
    const painted = await paintFaces(api, renderer, head, { bounds: faceBounds([head.outline, base.outline]) });
    const diff = await paintCopperDiff(api, renderer, { base, head }, painted);
    for (const c of [diff.top, painted.top]) document.body.append(c);
    const { bounds, size } = painted;
    const sample = (canvas, x, y) => {
      const px = Math.floor(((x - bounds.minX) / (bounds.maxX - bounds.minX)) * canvas.width);
      const py = Math.floor(((bounds.maxY - y) / (bounds.maxY - bounds.minY)) * canvas.height);
      return [...canvas.getContext('2d').getImageData(px, py, 1, 1).data.slice(0, 3)];
    };
    window.diff = { ok: true, size, sample: (face, x, y) => sample(diff[face], x, y), paint: (face, x, y) => sample(painted[face], x, y) };
  } catch (e) { window.diff = { ok: false, error: String(e.stack || e) }; }
</script>
