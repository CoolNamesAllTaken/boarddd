<!doctype html>
<meta charset="utf-8">
<title>boarddd board GLB test</title>
<style>html, body { margin: 0 } #v { width: 960px; height: 600px }</style>
<script src="/test/browser/pages/importmap.js"></script>
<div id="v"></div>
<script type="module">
  // boarddd.step.glb's output for python/tests/step/fixtures_occ/tiny.step: Draco, coarse then full.
  import * as THREE from 'three';
  import { createViewer } from '/src/scene/index.js';
  import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
  import { loadBoardGLB, upgradeBoardGLB } from '/src/models/index.js';
  const dracoLoader = new DRACOLoader().setDecoderPath('/node_modules/three/examples/jsm/libs/draco/gltf/');
  window.errors = [];
  try {
    const v = createViewer(document.getElementById('v'), { theme: 'light' });
    const coarse = await loadBoardGLB('/test/fixtures/tiny-board/draco-coarse.glb', { dracoLoader });
    v.add(coarse.object);
    v.setView('iso');
    window.v = v;
    const up = await upgradeBoardGLB(coarse.object, '/test/fixtures/tiny-board/draco-full.glb', { dracoLoader });
    dracoLoader.dispose();
    coarse.object.updateMatrixWorld(true);
    // From the vertices themselves (precise), not the accessors' bounds: those were right while
    // the decoded positions were the normals.
    const box = (name) => {
      const b = new THREE.Box3().setFromObject(coarse.nodes.find((n) => n.name === name).group, true);
      return [b.min.toArray(), b.max.toArray()];
    };
    const ray = (name) => {
      const [lo, hi] = box(name);
      const caster = new THREE.Raycaster(new THREE.Vector3((lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, 50), new THREE.Vector3(0, 0, -1));
      const hit = caster.intersectObjects(coarse.object.children, true)[0];
      let node = hit ? hit.object : null;
      while (node && node.parent !== coarse.object) node = node.parent;
      return node ? node.name : null;
    };
    window.report = {
      names: coarse.nodes.map((n) => n.name), coarse: coarse.triangles, full: up.triangles, swapped: up.swapped,
      R1: box('R1'), R5: box('R5'), meta: coarse.meta, hitR1: ray('R1'), hitU1: ray('U1'),
    };
    v.render?.();
  } catch (e) { window.errors.push(String(e.stack || e)); }
  window.ready = true;
</script>
