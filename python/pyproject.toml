[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "boarddd"
version = "0.3.0"
description = "PCB board and part ingestion (server side) for boarddd: the normalised board model and format readers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []  # core is stdlib only; readers that need more get extras (see the plan: shapely, xlsx, step, png)

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.14.0", "jsonschema>=4.23", "scipy>=1.11", "scikit-rf>=1.0"]  # scipy, scikit-rf: impedance cross-checks
xlsx = ["openpyxl>=3.1", "xlrd>=2.0"]  # io.bom: .xlsx/.xls BOMs (CSV needs nothing)
# boarddd.step's OpenCascade engine (split, measure, fingerprint, GLB, line drawings). cadquery-ocp is LGPL-2.1
# and about 440 MB installed; it is never vendored (docs/step.md). Needs libGL.so.1 at runtime.
step = ["cadquery-ocp>=7.8,<9", "numpy>=1.24", "shapely>=2.0"]
# boarddd.render.png: SVG -> PNG (cairosvg needs the system cairo library, libcairo2) and the review pixel diff.
render = ["cairosvg>=2.7", "pillow>=10", "numpy>=1.24"]

[project.urls]
Repository = "https://github.com/CoolNamesAllTaken/boarddd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # the formatter wraps code; long strings (field docs) stay on one line

[tool.ruff.format]

[tool.ruff.lint.isort]
known-first-party = ["boarddd"]
known-local-folder = ["conftest"]
